name: Linux builds

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            artifact: btop-mini-linux-x86_64
          - runner: ubuntu-26.04-arm
            artifact: btop-mini-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          make -j2
      - name: Verify executable
        run: ./bin/btop-mini --version
      - name: Smoke test 52x24 TUI
        run: |
          (sleep 2; printf P; sleep 2; printf P; sleep 1; printf q) | script -q -c 'stty rows 24 cols 52; TERM=xterm-256color ./bin/btop-mini' smoke.log
          grep -a 'btop-mini' smoke.log
      - name: Package
        run: |
          strip bin/btop-mini
          cp bin/btop-mini ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
